# =============================================================================
# docker-compose.yml — Mesin CLIENT (Two-Machine Mode)
# Setup: Laptop i5 8GB RAM, Fedora Linux Server OS
#
# Network mode "host": container berbagi network stack dengan host fisik.
# Diperlukan agar:
#   - tshark dapat menangkap traffic keluar ke server via NIC fisik
#   - tc/netem dapat diterapkan ke interface fisik yang benar
#
# Prasyarat sebelum menjalankan:
#   1. Set SERVER_HOST ke IP mesin server: export SERVER_HOST=<IP>
#   2. Sertifikat sudah di-generate via client-setup
#   3. server_*.crt dan server_*.key sudah disalin ke mesin server
#
# Cara pakai:
#   docker compose run --rm client-setup     ← generate semua sertifikat
#   docker compose run --rm client-run       ← jalankan eksperimen penuh
#   docker compose run --rm client-analyze   ← analisis hasil
#   docker compose run --rm client-shell     ← shell interaktif
# =============================================================================

name: thesis-tls-client

services:

  # ── Eksperimen penuh ────────────────────────────────────────────────────────
  client-run:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: thesis-tls-client:latest
    container_name: thesis-client-run

    # Host networking: container menggunakan NIC fisik laptop secara langsung.
    # Tidak perlu Docker bridge — traffic langsung keluar ke jaringan fisik.
    network_mode: "host"

    cap_add:
      - NET_ADMIN    # untuk tc/netem pada NIC fisik
      - NET_RAW      # untuk tshark raw socket capture

    volumes:
      - ../certs:/measurement/certs
      - ../results:/measurement/results
      - ./scripts:/measurement/scripts:ro
      - ./config:/measurement/config:ro

    environment:
      # WAJIB: set ke IP mesin server sebelum menjalankan
      #   export SERVER_HOST=<IP_SERVER>
      - SERVER_HOST=${SERVER_HOST:?Set SERVER_HOST=192.168.100.23}

      # Sesuaikan dengan nama NIC fisik di host.
      # Cek dengan: ip link show
      # Contoh nilai: eth0, enp2s0, ens3, wlan0
      - CAPTURE_IFACE=${CAPTURE_IFACE:-wlan0}

      - PAYLOAD_SIZE_KB=${PAYLOAD_SIZE_KB:-10}
      - WARMUP_ITERS=${WARMUP_ITERS:-20}
      - MEASURE_ITERS=${MEASURE_ITERS:-100}
      - CERTS_DIR=/measurement/certs
      - RESULTS_DIR=/measurement/results
      - OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf
      - SCENARIOS=${SCENARIOS:-A,B,C}
      - NETWORKS=${NETWORKS:-ideal,edge}

    # benchmark.py mengelola netem secara internal
    command: >
      python3 /measurement/scripts/benchmark.py
      --scenarios A B C
      --networks ideal edge
      --output-dir /measurement/results

    restart: "no"

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"


  # ── Generate sertifikat (jalankan sekali saja) ──────────────────────────────
  client-setup:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: thesis-tls-client:latest
    container_name: thesis-client-setup

    # Tidak butuh jaringan untuk generate sertifikat
    network_mode: "none"

    volumes:
      - ../certs:/measurement/certs
      - ./scripts:/measurement/scripts:ro
      - ./config:/measurement/config:ro

    environment:
      - OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf
      - CERTS_DIR=/measurement/certs

    command: bash /measurement/scripts/gen_certs.sh

    restart: "no"


  # ── Analisis hasil ──────────────────────────────────────────────────────────
  client-analyze:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: thesis-tls-client:latest
    container_name: thesis-client-analyze

    network_mode: "none"

    volumes:
      - ../results:/measurement/results
      - ./scripts:/measurement/scripts:ro

    environment:
      - RESULTS_DIR=/measurement/results
      - OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf

    # analysis.py membaca results_combined_latest.csv dari benchmark.py
    command: >
      python3 /measurement/scripts/analysis.py
      --results-file /measurement/results/results_combined_latest.csv
      --output-dir /measurement/results

    restart: "no"


  # ── Shell interaktif untuk debugging ───────────────────────────────────────
  client-shell:
    build:
      context: ..
      dockerfile: setup/Dockerfile
    image: thesis-tls-client:latest
    container_name: thesis-client-shell

    network_mode: "host"

    cap_add:
      - NET_ADMIN
      - NET_RAW

    volumes:
      - ../certs:/measurement/certs
      - ../results:/measurement/results
      - ./scripts:/measurement/scripts
      - ./config:/measurement/config

    environment:
      - SERVER_HOST=${SERVER_HOST:-192.168.100.23}
      - CAPTURE_IFACE=${CAPTURE_IFACE:-wlan0}
      - OPENSSL_CONF=/etc/ssl/openssl-oqs.cnf
      - CERTS_DIR=/measurement/certs
      - RESULTS_DIR=/measurement/results

    stdin_open: true
    tty: true
    command: bash

    restart: "no"
